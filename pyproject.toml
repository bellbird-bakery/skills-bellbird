[project]
name = "bellbird"
version = "0.3.0"
description = "Template skills for Claude Code projects"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0",
    "rich>=14.3.3",
]

[project.scripts]
bellbird = "bellbird.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bellbird"]
